# ============================================================================
# PERFIL DE CLIENTE - NACCI.EDIT AGENCY
# Cliente: Dra. Marina
# ============================================================================

client:
  id: "dra-marina"
  name: "Dra. Marina"
  niche: "Medicina / Saúde / Consultório"
  platforms:
    - "Instagram Reels (9:16 - 1080x1920 @ 30fps)"
    - "TikTok (9:16 - 1080x1920 @ 30fps)"
    - "YouTube Shorts (9:16)"
  target_lufs: -14.0

brand_identity:
  tone: "Autoridade acolhedora, científica, elegante, didática e humanizada"
  pacing:
    hook_first_3s: "Cortes rápidos (1.2s a 1.8s), B-roll de impacto ou manchete/artigo científico logo nos primeiros 2 segundos"
    body_pacing: "B-roll ou insert visual a cada 4 a 6 segundos para manter retenção sem perder sobriedade médica"
    cta_ending: "A-roll limpo (olho no olho) com lower-third discreto"
  colors:
    primary: "#1E3A3A"      # Verde petróleo / escuro sofisticado
    secondary: "#D4AF37"    # Dourado suave / champagne
    background: "#F9F6F0"   # Off-white / creme clínico limpo
    text_light: "#FFFFFF"
    text_dark: "#1A1A1A"
  typography:
    heading_font: "Playfair Display / Serif Elegante"
    body_font: "Inter / Montserrat"
    caption_style: "Clean minimalista na altura do terço inferior seguro (acima da legenda do Instagram)"

broll_preferences:
  preferred_sources:
    - "pexels"      # Cenas humanizadas, estilo de vida saudável, rotina, bem-estar
    - "wikimedia"   # Ilustrações anatômicas limpas, moléculas, diagramas científicos
    - "pixabay"     # Videos clínicos suaves, natureza, alimentação, sono
    - "youtube"     # Trechos de reportagens, estudos ou casos reais (via yt-dlp)
  visual_keywords_boost:
    - "aesthetic clinic"
    - "minimalist wellness"
    - "healthy lifestyle cinematic"
    - "medical research clean"
    - "calm morning routine"
  avoid_keywords:
    - "blood"
    - "surgery gore"
    - "pain exaggerated"
    - "cheap cartoon"
    - "stock cheesy doctor pointing"

compliance_cfm:
  # Regras baseadas na Resolução CFM nº 2.336/2023 (Publicidade Médica no Brasil)
  enforce_medical_guardrails: true
  rules:
    - "NÃO usar B-rolls sensacionalistas, imagens chocantes ou que causem pânico."
    - "NÃO prometer resultado garantido nos inserts de texto ('cura garantida', '100% eficaz')."
    - "Ao citar estudos científicos, priorizar print real do paper (PubMed / DOI) como B-roll literal com fonte visível."
    - "Manter caráter educativo e informativo nos B-rolls e legendas."

instagram_references:
  # Links de Reels que a Dra. Marina envia como referência de edição/estilo
  auto_analyze_metrics:
    - "cut_frequency_seconds"
    - "hook_visual_type"
    - "caption_position_and_style"
    - "broll_to_aroll_ratio"
  saved_references: []
